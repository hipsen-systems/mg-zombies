name: Build check

on:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot and export templates
        uses: ./.github/actions/setup-godot

      - name: Import project assets
        run: ./godot-bin --headless --path . --import

      - name: Verify the web build exports
        run: |
          mkdir -p build/web
          ./godot-bin --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      # Both presets are exported here, not just the one this PR's deploy will
      # use. `release.yml` is the only other place the Windows preset is built,
      # and it first runs when a `v*` tag is pushed -- so without this step a
      # broken Windows preset stays invisible until someone cuts a release
      # (issue #10).
      - name: Verify the Windows build exports
        run: |
          mkdir -p build/windows
          ./godot-bin --headless --path . --export-release "Windows Desktop" build/windows/mg-zombies.exe
          test -f build/windows/mg-zombies.exe

      # Deliberately a step of this job rather than a job of its own (issue
      # #16): `build-check` is already a required status check and already has
      # Godot set up, so the tests are gated from the first PR that runs them
      # without touching branch protection or the list of required contexts the
      # root CLAUDE.md names.
      - name: Run the headless smoke tests
        run: bash tests/run.sh ./godot-bin
