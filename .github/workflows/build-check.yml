name: Build check

on:
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot and export templates
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin
          curl -sL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project assets
        run: ./godot-bin --headless --path . --import

      - name: Verify the project exports
        run: |
          mkdir -p build/web
          ./godot-bin --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      # Deliberately a step of this job rather than a job of its own (issue
      # #16): `build-check` is already a required status check and already has
      # Godot set up, so the tests are gated from the first PR that runs them
      # without touching branch protection or the list of required contexts the
      # root CLAUDE.md names.
      - name: Run the headless smoke tests
        run: bash tests/run.sh ./godot-bin
